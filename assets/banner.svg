  <rect width="1280" height="480" fill="url(#gel)"/>
  <text x="72" y="250" fill="#f4efe6" font-family="ui-serif, Georgia, 'Times New Roman', serif" font-size="92" font-weight="500" letter-spacing="-2">Scrim</text>
  <text x="76" y="302" fill="#e8a04a" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" letter-spacing="3">THE CLOTH BETWEEN THE TOOL AND THE MODEL</text>
