    </g>
    <!-- opening weave -->
    <g stroke-width="1.15" opacity="0.35">
      <path d="M520 28h280M520 52h280M520 76h280M520 100h280M520 124h280M520 148h280M520 172h280M520 196h280M520 220h280M520 244h280M520 268h280M520 292h280M520 316h280M520 340h280M520 364h280M520 388h280M520 412h280M520 436h280M520 460h280"/>
    </g>
    <g stroke-width="1.4" opacity="0.85">
      <path d="M760 40h520M760 80h520M760 120h520M760 160h520M760 200h520M760 240h520M760 280h520M760 320h520M760 360h520M760 400h520M760 440h520"/>
