<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" role="img" aria-label="The hook pipeline: a tool call passes PreToolUse which caps listings, the tool runs, PostToolUse thins the result and stashes the original, the model reads the thinned view. Stop writes last.txt, which /scrim reads on a Haiku analyst.">
  <defs>
    <radialGradient id="lampglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0c36a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f0c36a" stop-opacity="0"/>
    </radialGradient>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#e8a04a" fill-opacity="0.75"/>
    </marker>
    <marker id="ahd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#f4efe6" fill-opacity="0.35"/>
    </marker>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="340" rx="16" fill="#0c0b0a"/>
  <rect x="1" y="1" width="1278" height="338" rx="15" fill="none" stroke="#e8a04a" stroke-opacity="0.2"/>

  <!-- ambient weave, lower left -->
  <g stroke="#e8a04a" stroke-width="1" opacity="0.05" fill="none">
    <path d="M48 236h330M48 252h300M48 268h340M48 284h280M48 300h320"/>
  </g>

  <!-- ============ main row ============ -->
  <rect x="48" y="56" width="130" height="56" rx="9" fill="#16120e" stroke="#f4efe6" stroke-opacity="0.1"/>
  <text x="113" y="89" class="mono" font-size="14.5" fill="#f4efe6" fill-opacity="0.8" text-anchor="middle">tool call</text>

  <path d="M178 84h41" stroke="#e8a04a" stroke-opacity="0.6" stroke-width="1.8" marker-end="url(#ah)"/>

  <rect x="226" y="56" width="190" height="56" rx="9" fill="#16120e" stroke="#e8a04a" stroke-opacity="0.3"/>
  <text x="321" y="80" class="mono" font-size="14.5" font-weight="600" fill="#e8a04a" text-anchor="middle">PreToolUse</text>
  <text x="321" y="100" class="mono" font-size="12" fill="#f4efe6" fill-opacity="0.45" text-anchor="middle">cap ls / rg / Grep</text>

  <path d="M416 84h39" stroke="#e8a04a" stroke-opacity="0.6" stroke-width="1.8" marker-end="url(#ah)"/>

  <rect x="462" y="56" width="130" height="56" rx="9" fill="#16120e" stroke="#f4efe6" stroke-opacity="0.1"/>
  <text x="527" y="89" class="mono" font-size="14.5" fill="#f4efe6" fill-opacity="0.8" text-anchor="middle">tool runs</text>

  <path d="M592 84h41" stroke="#e8a04a" stroke-opacity="0.6" stroke-width="1.8" marker-end="url(#ah)"/>

  <rect x="640" y="56" width="200" height="56" rx="9" fill="#16120e" stroke="#e8a04a" stroke-opacity="0.3"/>
  <text x="740" y="80" class="mono" font-size="14.5" font-weight="600" fill="#e8a04a" text-anchor="middle">PostToolUse</text>
  <text x="740" y="100" class="mono" font-size="12" fill="#f4efe6" fill-opacity="0.45" text-anchor="middle">thin &#183; stash &#183; log</text>

  <!-- the cloth hangs on this edge -->
  <path d="M840 84h53" stroke="#e8a04a" stroke-opacity="0.6" stroke-width="1.8" marker-end="url(#ah)"/>
  <g stroke="#e8a04a" stroke-width="1.6" opacity="0.55" stroke-linecap="round">
    <path d="M862 68v10M868 68v10M874 68v10M862 90v10M868 90v10M874 90v10"/>
  </g>

  <circle cx="960" cy="84" r="52" fill="url(#lampglow)"/>
  <rect x="900" y="56" width="120" height="56" rx="9" fill="#16120e" stroke="#f0c36a" stroke-opacity="0.35"/>
  <text x="960" y="89" class="mono" font-size="14.5" fill="#f0c36a" text-anchor="middle">model</text>

  <path d="M1020 84h37" stroke="#f4efe6" stroke-opacity="0.35" stroke-width="1.6" marker-end="url(#ahd)"/>

  <rect x="1064" y="56" width="94" height="56" rx="9" fill="#16120e" stroke="#f4efe6" stroke-opacity="0.1"/>
  <text x="1111" y="89" class="mono" font-size="14.5" fill="#f4efe6" fill-opacity="0.8" text-anchor="middle">Stop</text>

  <!-- ============ what PostToolUse leaves behind ============ -->
  <path d="M700 112 L 641 190" stroke="#f4efe6" stroke-opacity="0.3" stroke-width="1.5" marker-end="url(#ahd)"/>
  <path d="M780 112 L 889 190" stroke="#f4efe6" stroke-opacity="0.3" stroke-width="1.5" marker-end="url(#ahd)"/>

  <rect x="520" y="196" width="230" height="54" rx="9" fill="#16120e" stroke="#f4efe6" stroke-opacity="0.08"/>
  <text x="635" y="219" class="mono" font-size="13.5" fill="#f4efe6" fill-opacity="0.8" text-anchor="middle">~/.scrim/blobs/</text>
  <text x="635" y="238" class="mono" font-size="11.5" fill="#f4efe6" fill-opacity="0.42" text-anchor="middle">originals, kept 7 days</text>

  <rect x="774" y="196" width="240" height="54" rx="9" fill="#16120e" stroke="#f4efe6" stroke-opacity="0.08"/>
  <text x="894" y="219" class="mono" font-size="13.5" fill="#f4efe6" fill-opacity="0.8" text-anchor="middle">metrics.jsonl</text>
  <text x="894" y="238" class="mono" font-size="11.5" fill="#f4efe6" fill-opacity="0.42" text-anchor="middle">counts, never payloads</text>

  <!-- ============ the report ============ -->
  <path d="M1111 112 L 1125 190" stroke="#f4efe6" stroke-opacity="0.3" stroke-width="1.5" marker-end="url(#ahd)"/>

  <rect x="1038" y="196" width="202" height="54" rx="9" fill="#16120e" stroke="#f4efe6" stroke-opacity="0.08"/>
  <text x="1139" y="219" class="mono" font-size="13.5" fill="#f4efe6" fill-opacity="0.8" text-anchor="middle">~/.scrim/last.txt</text>
  <text x="1139" y="238" class="mono" font-size="11.5" fill="#f4efe6" fill-opacity="0.42" text-anchor="middle">the report, waiting</text>

  <path d="M1139 250 L 1139 268" stroke="#e8a04a" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="1038" y="272" width="202" height="48" rx="9" fill="#16120e" stroke="#e8a04a" stroke-opacity="0.25"/>
  <text x="1139" y="301" class="mono" font-size="13.5" text-anchor="middle"><tspan fill="#e8a04a">/scrim</tspan><tspan fill="#f4efe6" fill-opacity="0.7"> &#8594; Haiku analyst</tspan></text>

  <!-- fail-open, stated where it matters -->
  <rect x="48" y="278" width="96" height="30" rx="15" fill="none" stroke="#e8a04a" stroke-opacity="0.45"/>
  <text x="96" y="297" class="mono" font-size="12.5" fill="#e8a04a" fill-opacity="0.85" text-anchor="middle">fail-open</text>
  <text x="160" y="297" class="mono" font-size="12.5" fill="#f4efe6" fill-opacity="0.5">any hook error prints {} and exits 0 — the agent sees the original result</text>
</svg>
